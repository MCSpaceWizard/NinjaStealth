plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

sourceSets.main.resources {
    // Resources produced by the `data` run (datagen).
    srcDir('src/generated/resources')

    exclude('**/*.bbmodel') // Blockbench project files
    exclude('src/generated/**/.cache')
}

repositories {
    // Optional-dependency mavens (Curios, GeckoLib, EMI, Jade, ...) are added here as each
    // integration lands. Keep them commented until used so offline/limited networks still build.

    // Modrinth maven: only resolved when -PwithSodium / -PwithIris is passed (compat testing, doc 30).
    exclusiveContent {
        forRepository { maven { name = 'Modrinth'; url = 'https://api.modrinth.com/maven' } }
        filter { includeGroup 'maven.modrinth' }
    }

    // Player Animation Library (required, doc 17) and Bendable Cuboids (elbows and knees). Only the
    // ZigyTheBird/redlance groups resolve from this maven; everything else keeps coming from Central.
    exclusiveContent {
        forRepository { maven { name = 'Redlance'; url = 'https://repo.redlance.org/public' } }
        filter {
            includeGroupAndSubgroups 'com.zigythebird'
            includeGroup 'org.redlance.common-utils'
        }
    }
}

base {
    archivesName = mod_id
}

// Minecraft 26.1.x ships Java 25 to players, so we target it too.
java.toolchain.languageVersion = JavaLanguageVersion.of(25)

neoForge {
    version = project.neo_version

    // Access transformers in META-INF/accesstransformer.cfg are picked up automatically.

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            // ./gradlew runClient -PquickPlay=<world folder name> jumps straight into a singleplayer world.
            if (project.hasProperty('quickPlay')) {
                programArguments.addAll '--quickPlaySingleplayer', project.property('quickPlay').toString()
            }
        }

        // Second client for local co-op testing (LAN / connect to the `server` run).
        client2 {
            client()
            programArguments.addAll '--username', 'Dev2'
            gameDirectory = project.file('run/client2')
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        // Runs every registered GameTest headlessly, then exits. Wired up once the first tests land.
        gameTestServer {
            type = 'gameTestServer'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            clientData()
            programArguments.addAll '--mod', project.mod_id, '--all',
                    '--output', file('src/generated/resources/').getAbsolutePath(),
                    '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// `localRuntime`: mods present when running the game from the dev environment, but not
// published as dependencies (e.g. Jade/EMI/Shoulder Surfing for compat testing).
configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    // Player Animation Library: required on clients (players need it installed), not needed on servers.
    // We compile against its API (IAnimation, controllers, PAL-format clips). See doc 17 §8.
    // Non-transitive: its poms ask for newer joml/netty/gson than Minecraft's strict versions; the game provides
    // those, and the Neo jar bundles its own molang engine (jar-in-jar). Core holds the API and is a game library.
    implementation("com.zigythebird.playeranim:PlayerAnimationLibNeo:${pal_version}") { transitive = false }
    implementation("com.zigythebird.playeranim:PlayerAnimationLibCore:${pal_version}") { transitive = false }
    compileOnly("com.zigythebird:mochafloats:5.0.0") { transitive = false }
    // Bendable Cuboids: elbows and knees on NPCs and players (required on clients, like PAL).
    implementation "com.zigythebird.bendable_cuboids:BendableCuboidsMerged:${bendable_cuboids_version}"

    // Renderer compat testing (doc 30). Never required at runtime; nothing compiles against them.
    //   ./gradlew runClient -PwithSodium          (Sodium)
    //   ./gradlew runClient -PwithIris            (Sodium + Iris)
    if (project.hasProperty('withSodium') || project.hasProperty('withIris')) {
        localRuntime 'maven.modrinth:sodium:mc26.1.2-0.9.2-neoforge'
    }
    if (project.hasProperty('withIris')) {
        localRuntime 'maven.modrinth:iris:1.11.4+26.1-neoforge'
    }
}

var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
            pal_version_range      : pal_version_range,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
