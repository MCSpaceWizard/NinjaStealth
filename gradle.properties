# Gradle daemon settings. Minecraft decompilation/recompilation needs a decent heap.
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

## Environment
# Latest versions: https://projects.neoforged.net/neoforged/neoforge
# Baseline decided in docs/design/01-design-decisions.md (Q1). Bump neo_version freely within 26.1.2;
# changing minecraft_version is a deliberate port done at a milestone boundary.
minecraft_version=26.1.2
minecraft_version_range=[26.1.2]
neo_version=26.1.2.112

## Animation dependencies (doc 17 §8). PAL is required on clients; Bendable Cuboids is optional.
pal_version=1.2.8+mc.26.1
pal_version_range=[1.2.8,)
bendable_cuboids_version=2.0.2+mc.26.1.2

## Mod properties
mod_id=emergentstealth
mod_name=Emergent Stealth
# Private for now; GPL-3.0 is the intended licence once the project is distributed (V-12).
mod_license=All Rights Reserved
mod_version=0.0.1
mod_group_id=com.mcspacewizard.emergentstealth
mod_authors=MCSpaceWizard
mod_description=Deep stealth for Minecraft: light and shadow, sound, social stealth, a shinobi toolkit and a custom stealth AI.
