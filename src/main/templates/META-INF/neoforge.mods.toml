license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''
${mod_description}
'''

# Client-only visual lighting hooks (doc 30). Each mixin documents why no event suffices.
[[mixins]]
    config="${mod_id}.mixins.json"

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

# Player Animation Library animates players (crawl, drag/carry arms, takedown clips; doc 17 §8).
# Required on clients only: dedicated servers never load it, so a server without PAL accepts clients with it.
[[dependencies.${mod_id}]]
    modId="player_animation_library"
    type="required"
    versionRange="${pal_version_range}"
    ordering="AFTER"
    side="CLIENT"

# Bendable Cuboids gives NPCs and players elbows and knees. Required on clients, like PAL.
[[dependencies.${mod_id}]]
    modId="bendable_cuboids"
    type="required"
    versionRange="[2.0.2,)"
    ordering="AFTER"
    side="CLIENT"
